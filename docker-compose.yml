name: pi-pilot

services:
  pi-pilot:
    build: .
    image: pi-pilot:latest
    restart: unless-stopped
    working_dir: /workspace
    env_file:
      - .env
    environment:
      PI_PILOT_WORKSPACES: ${PI_PILOT_WORKSPACES:-/workspace}
      PI_PILOT_LOG_LEVEL: ${PI_PILOT_LOG_LEVEL:-info}
    volumes:
      - .:/workspace
      - ${HOME}/.pi/agent:/home/bun/.pi/agent
