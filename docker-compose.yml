name: pi-pilot

services:
  pi-pilot:
    build: .
    image: pi-pilot:latest
    restart: unless-stopped
    working_dir: /workspace
    env_file:
      - .env
    environment:
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
      PI_PILOT_WORKSPACES: ${PI_PILOT_WORKSPACES:-/workspace}
      PI_PILOT_LOG_LEVEL: ${PI_PILOT_LOG_LEVEL:-info}
      PI_PILOT_DATA_DIR: /home/bun/.pi/pilot/durable
    volumes:
      - .:/workspace
      - pilot-durable:/home/bun/.pi/pilot/durable

volumes:
  pilot-durable:
